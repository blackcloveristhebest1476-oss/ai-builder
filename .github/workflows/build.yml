name: Build Frame Window Analyzer

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the core test suite (no Geode needed)
        run: |
          cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests -j 4
          ctest --test-dir build-tests --output-on-failure -V

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      FWA_CI_LOG: ${{ github.workspace }}/fwa-compile.log

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Report compiler errors
        if: failure()
        shell: bash
        run: python3 ci/report_errors.py || python ci/report_errors.py

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
